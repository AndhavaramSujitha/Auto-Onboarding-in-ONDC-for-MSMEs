version: '3.8'
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ondc_auto_onboarder
    volumes:
      - mongo-data:/data/db

  backend:
    build: ../backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ../../.env.example
    depends_on:
      - mongo
    environment:
      SPRING_PROFILES_ACTIVE: dev

  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - backend

volumes:
  mongo-data:
