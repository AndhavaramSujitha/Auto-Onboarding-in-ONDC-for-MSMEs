
spring:
  config:
    import: optional:classpath:/application-dev.yml

app:
  jwt:
    secret: ${JWT_SECRET:ONDC-AutoOnboarder-Dev-Secret-Key-2026-32Bytes-Minimum}
    expirationMs: ${JWT_EXPIRATION_MS:86400000} # 1 day

  ocr:
    tesseract-data-path: "C:/Program Files/Tesseract-OCR/tessdata"

mongodb:
  uri: ${MONGODB_URI:mongodb://localhost:27017/ondc_auto_onboarder}
  database: ondc_auto_onboarder

server:
  port: 8081
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.security: DEBUG
