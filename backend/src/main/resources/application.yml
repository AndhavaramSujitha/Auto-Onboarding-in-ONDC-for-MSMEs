
server:
  port: ${PORT:8081}
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ondc_auto_onboarder}

app:
  jwt:
    secret: ${JWT_SECRET:ONDC-AutoOnboarder-Dev-Secret-Key-2026-32Bytes-Minimum}
    expirationMs: ${JWT_EXPIRATION_MS:86400000}

ocr:
  tesseract-data-path: ${TESSERACT_DATA_PATH:C:/Program Files/Tesseract-OCR/tessdata}

groq:
  api:
    key: ${GROQ_API_KEY:}

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.security: INFO
    org.springframework.data.mongodb: INFO
